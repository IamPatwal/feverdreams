<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FeverDreams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--bg:#05030c;--fg:#f4eefc;--mut:#a498bf;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05030c;--fg:#f4eefc;--mut:#a498bf}}
:root[data-theme="dark"]{--bg:#05030c;--fg:#f4eefc;--mut:#a498bf}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Instrument Serif",Georgia,serif;overflow-x:hidden}
body.lock{overflow:hidden}
#bg{position:fixed;inset:0;z-index:0}
#gl{position:fixed;left:0;top:0;width:380px;height:380px;border-radius:50%;pointer-events:none;z-index:30;background:radial-gradient(circle,rgba(190,120,255,.22),transparent 65%);mix-blend-mode:screen;opacity:0;transition:opacity .4s}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px}
h1{font:700 clamp(40px,10.5vw,138px)/1 Unbounded,"Arial Black",sans-serif;letter-spacing:-.05em;background:linear-gradient(100deg,#ff4fd8,#5dffb4,#ffa14a,#c07cff,#ff4fd8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 12s linear infinite,in 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sh{to{background-position:300% 0}}
@keyframes in{from{opacity:0;filter:blur(22px);letter-spacing:.3em}}
.sub{font-size:clamp(20px,2.6vw,30px);color:var(--mut);font-style:italic;margin-top:14px;animation:in 1.6s .3s cubic-bezier(.2,.8,.2,1) both}
#orbs{display:flex;gap:clamp(16px,3.4vw,48px);flex-wrap:wrap;justify-content:center;margin:clamp(30px,6vh,64px) 0 28px}
.orb{background:none;border:0;color:var(--fg);cursor:pointer;font:inherit;animation:fl 6s ease-in-out infinite,in 1.4s both;animation-delay:calc(var(--i)*-1.1s),calc(.7s + var(--i)*.12s)}
@keyframes fl{50%{transform:translateY(-14px)}}
.orb canvas{display:block;width:clamp(92px,13vw,170px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 44px -8px var(--c);transition:transform .7s cubic-bezier(.2,.8,.2,1),border-radius .7s,box-shadow .7s}
.orb:hover canvas,.orb:focus-visible canvas{transform:scale(1.16) rotate(8deg);border-radius:36%;box-shadow:0 0 90px 2px var(--c)}
.orb:focus-visible{outline:2px solid var(--c);outline-offset:10px;border-radius:20px}
.orb b{display:block;margin-top:16px;font:300 13px Unbounded,sans-serif}
.orb i{color:var(--mut);font-size:17px}
.hint{color:var(--mut);max-width:46ch;font-size:18px}
#veil{position:fixed;inset:0;z-index:20;display:none}
#veil.on{display:block}
#veil.melt{filter:url(#melt)}
#scene{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top,0px)) 0 max(22px,env(safe-area-inset-bottom,0px));background:radial-gradient(130% 90% at 50% 0,color-mix(in srgb,var(--c) 30%,#04020a),#04020a 72%)}
.x{align-self:flex-start;margin:0 0 0 clamp(18px,5vw,64px);background:none;color:var(--fg);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:99px;padding:9px 20px;font:300 13px Unbounded,sans-serif;cursor:pointer;transition:background .3s}
.x:hover,.x:focus-visible{background:color-mix(in srgb,var(--c) 30%,transparent);outline:none}
.hd{padding:clamp(18px,4vh,44px) clamp(18px,5vw,64px) 0}
.hd small{display:block;font:300 15px Unbounded,sans-serif;color:var(--c)}
.ttl{font:700 clamp(30px,6.4vw,92px)/1.05 Unbounded,sans-serif;letter-spacing:-.04em;margin-top:8px}
.ttl span{display:inline-block;opacity:0;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.7s + var(--i)*.035s)}
.hd p{font-size:clamp(20px,2.4vw,28px);color:var(--mut);font-style:italic;margin-top:8px}
.strip{flex:1;display:flex;align-items:center;gap:clamp(18px,3vw,44px);overflow-x:auto;padding:24px clamp(18px,5vw,64px);scrollbar-width:none;touch-action:pan-x pan-y;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.fr{flex:0 0 auto;height:min(52vh,540px);aspect-ratio:3/4;position:relative;opacity:0;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1s + var(--i)*.16s)}
.fr canvas{width:100%;height:100%;display:block;border-radius:20px;box-shadow:0 30px 80px -24px var(--c);transition:transform .25s ease-out}
.fr figcaption{position:absolute;left:18px;bottom:16px;font:300 13px Unbounded,sans-serif;text-shadow:0 2px 12px #000;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(90px) rotate(3deg);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
footer{padding:0 clamp(18px,5vw,64px);color:var(--mut);font-size:17px;font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="melt"><feTurbulence type="fractalNoise" baseFrequency=".007 .011" numOctaves="2" seed="4"/><feDisplacementMap id="dm" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<canvas id="bg"></canvas><div id="gl"></div>
<main>
<h1>FeverDreams</h1>
<p class="sub">Five doors into places that don’t exist.</p>
<div id="orbs"></div>
<p class="hint">Step through a door. Every picture here is painted live, in your browser, by code.</p>
</main>
<div id="veil"><section id="scene" aria-live="polite"></section></div>
<script>
const $=s=>document.querySelector(s);
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;
const hs=(i,j,s)=>{const v=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return v-Math.floor(v)};
const sm=t=>t*t*(3-2*t);
function vn(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j),a=hs(i,j,s),b=hs(i+1,j,s),c=hs(i,j+1,s),d=hs(i+1,j+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
const fbm=(x,y,s)=>{let v=0,a=.5;for(let o=0;o<4;o++){v+=a*vn(x,y,s+o);x*=2;y*=2;a/=2}return v};
const cl=v=>Math.min(1,Math.max(0,v));
function stars(g,w,h,r,n){g.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const x=r()*w,y=r()*h,z=r()*1.6+.3;g.fillStyle=`rgba(255,255,255,${r()*.8+.2})`;g.beginPath();g.arc(x,y,z,0,7);g.fill();if(z>1.5){const q=g.createRadialGradient(x,y,0,x,y,z*6);q.addColorStop(0,'rgba(180,200,255,.5)');q.addColorStop(1,'rgba(180,200,255,0)');g.fillStyle=q;g.fillRect(x-z*6,y-z*6,z*12,z*12)}}g.globalCompositeOperation='source-over'}
const D={};
D.cosmos=(g,w,h,r,s)=>{const sw=Math.ceil(w/4),sh=Math.ceil(h/4),o=document.createElement('canvas');o.width=sw;o.height=sh;const c=o.getContext('2d'),im=c.createImageData(sw,sh),d=im.data,hu=r()*60;
for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const u=x/sw*3,v=y/sh*3*(h/w),m=sm(cl((fbm(u+s,v,s)-.38)*2.6)),k=sm(cl((fbm(u*1.7+9,v*1.7+4,s+5)-.42)*3)),i=(y*sw+x)*4;d[i]=8+m*(190+hu)+k*40;d[i+1]=6+m*30+k*150;d[i+2]=20+m*140+k*200;d[i+3]=255}
c.putImageData(im,0,0);g.drawImage(o,0,0,w,h);stars(g,w,h,r,140);
const px=w*(.3+r()*.4),py=h*(.3+r()*.3),pr=w*(.08+r()*.07);let q=g.createRadialGradient(px-pr*.4,py-pr*.4,pr*.1,px,py,pr);q.addColorStop(0,'#fff6e0');q.addColorStop(1,'#3a1055');g.fillStyle=q;g.beginPath();g.arc(px,py,pr,0,7);g.fill();
q=g.createRadialGradient(px,py,pr,px,py,pr*3);q.addColorStop(0,'rgba(255,180,255,.35)');q.addColorStop(1,'rgba(255,180,255,0)');g.fillStyle=q;g.fillRect(px-pr*3,py-pr*3,pr*6,pr*6)};
D.aurora=(g,w,h,r,s)=>{let q=g.createLinearGradient(0,0,0,h);q.addColorStop(0,'#02030f');q.addColorStop(.7,'#0a1a2e');q.addColorStop(1,'#0d2b3a');g.fillStyle=q;g.fillRect(0,0,w,h);stars(g,w,h,r,120);g.globalCompositeOperation='lighter';
for(let b=0;b<3;b++){const hu=[140,170,280][b]+r()*20,base=h*(.22+b*.07),amp=h*.07;for(let x=0;x<w;x+=2){const t=x/w*6,top=base+Math.sin(t+s+b*2)*amp+fbm(t,b,s)*amp*1.5,len=h*(.22+.15*fbm(t*2,b+5,s)),gr=g.createLinearGradient(0,top,0,top+len);gr.addColorStop(0,`hsla(${hu},90%,60%,0)`);gr.addColorStop(.15,`hsla(${hu},90%,60%,.22)`);gr.addColorStop(1,`hsla(${hu+40},90%,50%,0)`);g.fillStyle=gr;g.fillRect(x,top,2,len)}}
g.globalCompositeOperation='source-over';g.fillStyle='#01060b';g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=4)g.lineTo(x,h*.82-fbm(x/w*4,3,s)*h*.22);g.lineTo(w,h);g.fill()};
D.tides=(g,w,h,r,s)=>{let q=g.createLinearGradient(0,0,0,h);q.addColorStop(0,'#020b1a');q.addColorStop(.45,'#04283a');q.addColorStop(1,'#00131c');g.fillStyle=q;g.fillRect(0,0,w,h);
const mx=w*(.3+r()*.4),my=h*.2;q=g.createRadialGradient(mx,my,0,mx,my,w*.5);q.addColorStop(0,'rgba(190,255,245,.55)');q.addColorStop(.1,'rgba(120,230,220,.2)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,w,h);g.fillStyle='#e8fffb';g.beginPath();g.arc(mx,my,w*.035,0,7);g.fill();
for(let l=0;l<9;l++){const y0=h*(.38+l*.07),a=h*(.01+l*.006);g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=6)g.lineTo(x,y0+Math.sin(x/w*(5+l)+s+l)*a+Math.sin(x/w*13+l*2)*a*.4);g.lineTo(w,h);g.closePath();const f=g.createLinearGradient(0,y0-a,0,y0+h*.1);f.addColorStop(0,`hsla(${170+l*6},80%,${14+l*3}%,.95)`);f.addColorStop(1,'rgba(0,12,20,.95)');g.fillStyle=f;g.fill();g.strokeStyle=`hsla(${165+l*6},90%,70%,${.12+l*.03})`;g.stroke()}
g.globalCompositeOperation='lighter';for(let i=0;i<90;i++){const x=r()*w,y=h*(.45+r()*.55),z=r()*3+1,f=g.createRadialGradient(x,y,0,x,y,z*5);f.addColorStop(0,'rgba(120,255,230,.8)');f.addColorStop(1,'rgba(0,255,200,0)');g.fillStyle=f;g.fillRect(x-z*5,y-z*5,z*10,z*10)}g.globalCompositeOperation='source-over'};
D.dunes=(g,w,h,r,s)=>{let q=g.createLinearGradient(0,0,0,h*.7);q.addColorStop(0,'#2a0a3d');q.addColorStop(.5,'#c0396b');q.addColorStop(1,'#ffb347');g.fillStyle=q;g.fillRect(0,0,w,h);
const sx=w*(.35+r()*.3),sy=h*.38;q=g.createRadialGradient(sx,sy,0,sx,sy,w*.6);q.addColorStop(0,'rgba(255,240,200,.9)');q.addColorStop(.2,'rgba(255,170,90,.35)');q.addColorStop(1,'rgba(255,120,60,0)');g.fillStyle=q;g.fillRect(0,0,w,h);g.fillStyle='#fff3d6';g.beginPath();g.arc(sx,sy,w*.07,0,7);g.fill();
for(let l=0;l<6;l++){const y0=h*(.5+l*.09);g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=5)g.lineTo(x,y0-fbm(x/w*(2+l*.6)+l*3,l,s)*h*(.16-l*.01)+Math.sin(x/w*3+l)*h*.015);g.lineTo(w,h);g.closePath();g.fillStyle=`hsl(${22-l*3},${75-l*4}%,${58-l*9}%)`;g.fill()}};
D.bloom=(g,w,h,r,s)=>{let q=g.createRadialGradient(w/2,h/2,0,w/2,h/2,h*.7);q.addColorStop(0,'#1a0630');q.addColorStop(1,'#020006');g.fillStyle=q;g.fillRect(0,0,w,h);g.globalCompositeOperation='lighter';g.translate(w/2,h/2);
const n=7+Math.floor(r()*6),hu=r()*360,m=Math.min(w,h);
for(let L=0;L<7;L++){const rl=m*(.1+L*.055),rw=rl*.32;for(let i=0;i<n;i++){g.save();g.rotate(i/n*6.2832+L*.2);g.beginPath();g.ellipse(0,-rl,rw,rl,0,0,6.2832);g.strokeStyle=`hsla(${(hu+L*22)%360},90%,${55+L*4}%,.28)`;g.lineWidth=1.3;g.stroke();g.restore()}}
for(let i=0;i<110;i++){const a=r()*6.28,d=m*(.05+r()*.5),x=Math.cos(a)*d,y=Math.sin(a)*d,z=r()*3+1,f=g.createRadialGradient(x,y,0,x,y,z*4);f.addColorStop(0,`hsla(${hu+60},100%,75%,.9)`);f.addColorStop(1,'hsla(0,0%,0%,0)');g.fillStyle=f;g.fillRect(x-z*4,y-z*4,z*8,z*8)}
g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over'};
const paint=(cv,k,s)=>D[k](cv.getContext('2d'),cv.width,cv.height,rng(s*997+13),s);

const C=[
{n:'Nebula Cathedral',t:'Cosmos',l:'Where dead stars still sing.',k:'cosmos',c:'#ff4fd8',f:['Vesper Gate','The Quiet Furnace','Choir of Dust','Last Lantern']},
{n:'Aurora Requiem',t:'Sky',l:'The north remembers in green.',k:'aurora',c:'#5dffb4',f:['Ribbon Hymn','Frozen Applause','Verdigris Hour','Night’s Lullaby']},
{n:'Lumen Tides',t:'Ocean',l:'A sea that glows when it dreams.',k:'tides',c:'#44f0e0',f:['Moonwake','Salt Cathedral','Drift of Sparks','Abyssal Lull']},
{n:'Ember Meridian',t:'Desert',l:'A sunset that never learned to end.',k:'dunes',c:'#ffa14a',f:['Mirage Atlas','Slow Fire','Dune Psalm','Amber Vow']},
{n:'Bloom Oracle',t:'Life',l:'Petals that know your name.',k:'bloom',c:'#c07cff',f:['Mandala of Pollen','Velvet Eclipse','Spore Choir','The Open Eye']}];

const veil=$('#veil'),sc=$('#scene'),dm=$('#dm'),gl=$('#gl');let ox=0,oy=0,anim;
function melt(dur){veil.classList.add('melt');const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/dur);dm.setAttribute('scale',Math.sin(p*Math.PI)*80);p<1?requestAnimationFrame(f):veil.classList.remove('melt')})(t0)}
const circ=(x,y,r)=>({clipPath:`circle(${r}px at ${x}px ${y}px)`});
function build(i){const d=C[i];
sc.innerHTML=`<button class="x">Wake up</button><div class="hd"><small>${d.t}</small><h2 class="ttl">${[...d.n].map((c,j)=>`<span style="--i:${j}">${c==' '?'&nbsp;':c}</span>`).join('')}</h2><p>${d.l}</p></div><div class="strip">${d.f.map((f,j)=>`<figure class="fr" style="--i:${j}"><canvas width="450" height="600"></canvas><figcaption>${f}</figcaption></figure>`).join('')}</div><footer>Drag or scroll sideways to wander.</footer>`;
sc.querySelectorAll('canvas').forEach((cv,j)=>paint(cv,d.k,i*10+j+1));
sc.querySelector('.x').onclick=close;
const st=sc.querySelector('.strip');st.onwheel=e=>{st.scrollLeft+=e.deltaY+e.deltaX};
let dn,sx,sl;st.onpointerdown=e=>{if(e.pointerType=='mouse'){dn=1;sx=e.clientX;sl=st.scrollLeft}};st.onpointermove=e=>{if(dn)st.scrollLeft=sl-(e.clientX-sx)};addEventListener('pointerup',()=>dn=0);
sc.querySelectorAll('.fr').forEach(f=>{const cv=f.querySelector('canvas');f.onmousemove=e=>{const r=f.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;cv.style.transform=`perspective(800px) rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.04)`};f.onmouseleave=()=>cv.style.transform=''})}
function open(i,x,y){ox=x;oy=y;veil.style.setProperty('--c',C[i].c);build(i);veil.classList.add('on');document.body.classList.add('lock');const R=Math.hypot(innerWidth,innerHeight);melt(1400);if(anim)anim.cancel();anim=sc.animate([circ(x,y,0),circ(x,y,R)],{duration:1400,easing:'cubic-bezier(.76,0,.24,1)',fill:'forwards'})}
function close(){if(!veil.classList.contains('on'))return;const R=Math.hypot(innerWidth,innerHeight);melt(1100);const a=sc.animate([circ(ox,oy,R),circ(ox,oy,0)],{duration:1100,easing:'cubic-bezier(.76,0,.24,1)',fill:'forwards'});a.onfinish=()=>{veil.classList.remove('on');document.body.classList.remove('lock');a.cancel();if(anim)anim.cancel();sc.innerHTML=''}}
addEventListener('keydown',e=>{if(e.key=='Escape')close()});

C.forEach((d,i)=>{const b=document.createElement('button');b.className='orb';b.style.cssText=`--c:${d.c};--i:${i}`;b.innerHTML=`<canvas width="240" height="240"></canvas><b>${d.n}</b><i>${d.t}</i>`;paint(b.querySelector('canvas'),d.k,i*10+1);b.onclick=()=>{const r=b.querySelector('canvas').getBoundingClientRect();open(i,r.left+r.width/2,r.top+r.height/2)};$('#orbs').append(b)});

const bg=$('#bg'),bx=bg.getContext('2d');let P=[],mx=0,my=0;
function rs(){bg.width=innerWidth;bg.height=innerHeight;P=Array.from({length:110},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,z:Math.random()*2+.3}))}
rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;gl.style.opacity=1;gl.style.transform=`translate(${e.clientX-190}px,${e.clientY-190}px)`});
(function loop(){if(!veil.classList.contains('on')){bx.clearRect(0,0,bg.width,bg.height);for(const p of P){p.y-=.12*p.z;if(p.y<0)p.y=bg.height;bx.fillStyle=`rgba(220,200,255,${.2+.2*p.z/2.3})`;bx.beginPath();bx.arc(p.x-mx*p.z*40,p.y-my*p.z*40,p.z,0,7);bx.fill()}}requestAnimationFrame(loop)})();
</script>
</body>
</html>
